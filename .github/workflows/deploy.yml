name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    # Documentation-only commits do not change the site, so they should not spend a deploy.
    paths:
      - 'courses/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'firebase.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# On rapid successive pushes keep only the newest deploy, without cancelling one in flight.
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git diff below needs the previous commit to work out what changed.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # GitHub Pages publishes one artifact for the whole site, so a single course cannot be
      # deployed on its own. What this cache does buy is skipping the work: if only markdown
      # changed, turbo replays the cached web build instead of recompiling it, and vice versa.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report which courses changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Full build: no previous commit to compare against." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- courses/ \
            | cut -d/ -f2 | sort -u)
          if [ -z "$CHANGED" ]; then
            echo "No course content changed; only app or tooling code." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Courses changed in this push:" >> "$GITHUB_STEP_SUMMARY"
            echo "$CHANGED" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi

      # turbo builds @study/content first, which re-reads every markdown file under courses/.
      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: pnpm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: aws-certificate-77a3d
          channelId: live
